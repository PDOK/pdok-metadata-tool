# Run-once CSW load test. Start with (use `create`, not `apply`, because of generateName):
#   kubectl --context <ctx> -n <namespace> create -f k8s/load-test-job-test.yaml
# Fetch the report once the `collect` container prints "report ready":
#   kubectl -n <namespace> get pods -l app=pmt-load-test
#   kubectl -n <namespace> cp -c collect <pod>:/out ./load-test-out
apiVersion: batch/v1
kind: Job
metadata:
  generateName: pmt-load-test-test-
  labels:
    app: pmt-load-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pmt-load-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pmt
          image: ghcr.io/pdok/pdok-metadata-tool:PDOK-19632-csw-load-test
          imagePullPolicy: Always
          args:
            - csw
            - load-test
            - --label=aks-test-kangaroo
            - --output-dir=/out
            - --ids-cache-path=/out/service-ids.json
            - --workers=2
            - --iterations=1
            # - --requests-per-minute=120
            # - --duration=30m
            # - --no-keep-alive
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
        # Keeps the pod alive after the run so the results can be copied out.
        - name: collect
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until ls /out/*/report.html >/dev/null 2>&1; do sleep 5; done
              echo "report ready: $(ls -d /out/*/)"
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: out
          emptyDir: {}
