# Run-once connection test (new connection per request) against NGR and neutral control targets.
# Start with (use `create`, not `apply`, because of generateName):
#   kubectl --context <ctx> -n <namespace> create -f k8s/connection-test-job-test.yaml
# Fetch the reports once the `collect` container prints "reports ready":
#   kubectl -n <namespace> get pods -l app=pmt-connection-test
#   kubectl -n <namespace> cp -c collect <pod>:/out ./connection-test-out
apiVersion: batch/v1
kind: Job
metadata:
  generateName: pmt-connection-test-test-
  labels:
    app: pmt-connection-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pmt-connection-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pmt
          image: ghcr.io/pdok/pdok-metadata-tool:PDOK-19632-csw-load-test
          imagePullPolicy: Always
          args:
            - csw
            - connection-test
            - --label=test-cluster
            - --output-dir=/out
            - --requests=200
            - --workers=6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
        # Keeps the pod alive after the run so the results can be copied out.
        - name: collect
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until [ "$(ls /out/*/report.html 2>/dev/null | wc -l)" -ge 5 ]; do sleep 5; done
              echo "reports ready: $(ls -d /out/*/)"
              sleep 3600
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: out
          emptyDir: {}
